[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swctx-py"
version = "0.1.0"
description = "Local semantic code index + MCP server — cross-platform port of swctx (Windows/Linux/macOS). No cloud, no credits."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Phạm Đức Phương Nam" }]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "huggingface_hub>=0.23",
    "mcp>=1.2",
]

[project.optional-dependencies]
ast = ["tree-sitter-language-pack>=0.7"]

[project.scripts]
swctx-py = "swctx_py.__main__:main"

[tool.setuptools.packages.find]
include = ["swctx_py*"]
